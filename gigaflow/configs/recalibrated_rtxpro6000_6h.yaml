# Fresh six-hour RTX PRO 6000 run with recalibrated safety gates.
# Budget: 2400 updates at ~8.3 s/update plus 12 sentinel evals (~66 s each).
config_version: 1
seed: 0

tracks:
  manifest_path: ~/.cache/gigaflow/tracks/manifest.json
  num_tracks: 23
  sampling: stratified_shuffle
  include_optional_local: false

worlds:
  num_worlds: 448
  max_agents_per_world: 8
  solo_world_fraction: 0.05
  density_bins: [sparse, medium, dense]
  device: cuda
  static_opponents_per_world: 2

agents:
  car_length_m: 0.568
  car_width_m: 0.296
  control_hz: 10.0
  sim_dt: 0.005
  control_interval: 20
  lidar_dim: 1081
  proprio_dim: 16
  sensor_obs_dim: 1097
  action_dim: 2
  gru_hidden_dim: 512
  cnn_projection_dim: 256
  actor_mlp_sizes: [1024, 1024, 1024]
  condition_dim: 10
  target_laps: 3.0
  reference_speed_mps: 3.5
  episode_seconds_min: 120.0
  episode_seconds_max: 360.0
  async_respawn: true

reward_conditioning:
  enabled: true
  x_drive_a: 1.25
  x_accel_a: 1.5
  enable_finish_rank: false
  enable_blocking: false
  enable_zero_sum: false

ppo:
  rollout_length: 128
  gamma: 0.999
  gae_lambda: 0.95
  clip_ratio: 0.2
  ent_coef: null
  ent_coef_initial: 0.005
  ent_coef_final: 0.0005
  ent_anneal_updates: 2000
  vf_coef: 0.5
  max_grad_norm: 0.5
  learning_rate: 1.0e-4
  num_epochs: 3
  minibatch_size: 32768
  adaptive_filter_beta: 0.25
  adaptive_filter_eta_scale: 0.01
  adaptive_filter_enabled: true
  value_clip: false
  amp: true
  total_updates: 2400
  target_kl: 0.0
  actor_kl_soft: 0.05
  actor_kl_hard: 0.20
  actor_lr_backoff: 0.5
  actor_lr_scale_min: 0.125
  actor_kl_warmup_updates: 200
  actor_kl_stop_window_updates: 500
  actor_kl_stop_window_count: 5
  actor_lr_recovery_interval_updates: 100
  actor_lr_recovery_multiplier: 2.0
  actor_checkpoint_interval_updates: 100
  full_checkpoint_interval_updates: 200
  max_pre_update_kl: 1.0e-3
  max_logp_delta: 5.0e-3

evaluation:
  sync_no_respawn: true
  seeds: [0]
  suite: [solo, head_to_head, dense]
  conservative_deployment_style: centered_high_collision
  soak_steps: 2000
  viz_enabled: false
  viz_fps: 10
  viz_max_frames: 240
  incident_window_steps: 32
  device: cpu
  num_worlds: 32
  behavior_feasibility_passes: 2
  behavior_no_feasibility_stop_updates: 1000

ablations:
  actor_variant: gru
  frame_stack: 1
  centralized_critic: true
  adaptive_filter_enabled: true
  surprise_braking: false
  reward_randomization: true
  condition_to_actor: true

profiling:
  enabled: true
  estimate_bytes_budget: 92000000000
  report_interval_updates: 10

wandb:
  enabled: false
  mode: online
  entity: null
  project: f1tenth-gigaflow
  group: recalibrated-robust6h
  name: null
  tags:
    [recalibrated-robust6h, rtx-pro-6000, entropy-anneal, actor-rollback, fresh-init]
  notes: Recalibrated six-hour gate; not a 7,000-update long-horizon proof.
  run_id: null
  resume: never
  eval_interval_updates: 200
  log_artifacts: true
