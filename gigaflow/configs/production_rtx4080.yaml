# RTX 4080 SUPER (16 GiB) production all-track self-play.
# Measured on the card at 48 worlds x 8 agents, rollout 128, with the D1 critic
# track preview (ego branch 45 -> 145): 5.17 GiB allocated peak (86% of the
# 5.94 GiB estimate, within its headroom), 9.91 GiB reserved by the caching
# allocator, 11.1 GiB of 16 GiB device memory in use including the CUDA
# context and the Warp arrays. 128 worlds needs ~15.4 GiB allocated and does
# not fit; 64 worlds leaves only 1.8 GiB free, which a GPU-side evaluation or
# visualization pass can exhaust. Single-machine.
config_version: 1
seed: 0

tracks:
  manifest_path: ~/.cache/gigaflow/tracks/manifest.json
  num_tracks: 23
  sampling: stratified_shuffle
  include_optional_local: false

worlds:
  num_worlds: 48
  max_agents_per_world: 8
  solo_world_fraction: 0.05
  density_bins: [sparse, medium, dense]
  device: cuda
  # Light static-opponent preset (paper's immobile agents): reserved out of
  # max_agents_per_world, not added on top, so it does not raise VRAM use.
  static_opponents_per_world: 2

agents:
  car_length_m: 0.568
  car_width_m: 0.296
  control_hz: 10.0
  sim_dt: 0.005
  control_interval: 20
  lidar_dim: 1081
  proprio_dim: 16
  sensor_obs_dim: 1097
  action_dim: 2
  gru_hidden_dim: 512
  cnn_projection_dim: 256
  actor_mlp_sizes: [1024, 1024, 1024]
  condition_dim: 10
  target_laps: 3.0
  reference_speed_mps: 3.5
  episode_seconds_min: 120.0
  episode_seconds_max: 360.0
  async_respawn: true

reward_conditioning:
  enabled: true
  x_drive_a: 1.25
  x_accel_a: 1.5
  enable_finish_rank: false
  enable_blocking: false
  enable_zero_sum: false

ppo:
  rollout_length: 128
  gamma: 0.999
  gae_lambda: 0.95
  clip_ratio: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  # Scale-adjusted, not the paper's 5e-4. At 5e-4 this config collapsed twice
  # (updates 4800 and 5600) when heavy-tailed advantages met an unbounded step.
  learning_rate: 1.0e-4
  num_epochs: 3
  minibatch_size: 2048
  adaptive_filter_beta: 0.25
  adaptive_filter_eta_scale: 0.01
  adaptive_filter_enabled: true
  value_clip: false
  amp: true
  total_updates: 10000
  # Paper discloses no KL early-stop, and the check runs after optimizer.step().
  target_kl: 0.0

evaluation:
  sync_no_respawn: true
  seeds: [0, 1, 2]
  suite: [solo, head_to_head, dense]
  conservative_deployment_style: centered_high_collision
  soak_steps: 2000
  viz_enabled: true
  incident_window_steps: 32
  # Cadenced eval: isolated CPU subprocess (no CUDA), same as production_h100.
  # The 16 GiB card has little headroom for an in-process GPU eval alongside
  # training; hiding CUDA from the eval child avoids competing for it.
  device: cpu
  num_worlds: null

ablations:
  actor_variant: gru
  frame_stack: 1
  centralized_critic: true
  adaptive_filter_enabled: true
  surprise_braking: false
  reward_randomization: true
  condition_to_actor: true

profiling:
  enabled: true
  # Allocated-peak ceiling for this card: the allocator reserves ~1.9x the
  # allocated peak and the context plus Warp add ~1.6 GiB on top, so 8 GB
  # allocated is about as far as 16 GiB of VRAM stretches. Estimate here: 5.9 GiB.
  estimate_bytes_budget: 8000000000
  report_interval_updates: 10

# Enable online via CLI for the corrected relaunch (Phase 5 of the gigaflow
# audit remediation plan). Never put API keys in this file.
wandb:
  enabled: false
  mode: online
  entity: null
  project: f1tenth-gigaflow
  group: prod_rtx4080_audit_remediation
  name: null
  tags: [production, rtx4080, selfplay, audit-remediation]
  notes: null
  run_id: null
  resume: allow
  eval_interval_updates: 100
  log_artifacts: true
