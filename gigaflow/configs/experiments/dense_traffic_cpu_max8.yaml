# CPU-local dense-traffic baseline (max 8). Does not change production defaults.
config_version: 1
seed: 0

tracks:
  manifest_path: null
  num_tracks: 1
  sampling: stratified_shuffle
  include_optional_local: false

worlds:
  num_worlds: 8
  max_agents_per_world: 8
  solo_world_fraction: 0.05
  density_bins: [sparse, medium, dense]
  device: cpu

agents:
  car_length_m: 0.568
  car_width_m: 0.296
  control_hz: 10.0
  sim_dt: 0.005
  control_interval: 20
  lidar_dim: 1081
  proprio_dim: 16
  sensor_obs_dim: 1097
  action_dim: 2
  gru_hidden_dim: 64
  cnn_projection_dim: 64
  actor_mlp_sizes: [128, 128]
  condition_dim: 10
  target_laps: 1.0
  reference_speed_mps: 3.5
  episode_seconds_min: 30.0
  episode_seconds_max: 120.0
  async_respawn: true

reward_conditioning:
  enabled: true
  x_drive_a: 1.25
  x_accel_a: 1.5
  enable_finish_rank: false
  enable_blocking: false
  enable_zero_sum: false

ppo:
  rollout_length: 16
  gamma: 0.999
  gae_lambda: 0.95
  clip_ratio: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  learning_rate: 5.0e-4
  num_epochs: 1
  minibatch_size: 64
  adaptive_filter_beta: 0.25
  adaptive_filter_eta_scale: 0.01
  adaptive_filter_enabled: true
  value_clip: false
  amp: false
  total_updates: 4
  target_kl: 0.05

evaluation:
  sync_no_respawn: true
  seeds: [0]
  suite: [solo, head_to_head, dense]
  conservative_deployment_style: centered_high_collision
  soak_steps: 40
  viz_enabled: false
  viz_fps: 5
  viz_max_frames: 8
  incident_window_steps: 8
  device: cpu
  num_worlds: 4

ablations:
  actor_variant: gru
  frame_stack: 1
  centralized_critic: true
  adaptive_filter_enabled: true
  surprise_braking: false
  reward_randomization: true
  condition_to_actor: true

profiling:
  enabled: true
  estimate_bytes_budget: 4000000000
  report_interval_updates: 1

wandb:
  enabled: false
  mode: offline
  entity: null
  project: f1tenth-gigaflow
  group: dense_traffic
  name: null
  tags: [dense_traffic, cpu, max8]
  notes: null
  run_id: null
  resume: allow
  eval_interval_updates: 0
  log_artifacts: false
