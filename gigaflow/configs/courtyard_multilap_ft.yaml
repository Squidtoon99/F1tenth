# Courtyard-only online FT of baked actor_005700 (MaxPool64 / 512-D).
# Student sees 1097-D lidar+proprio with hardcoded IRL condition.
config_version: 1
seed: 0

tracks:
  manifest_path: /tmp/gigaflow-courtyard-atlas/manifest.json
  num_tracks: 1
  sampling: stratified_shuffle
  include_optional_local: false

worlds:
  num_worlds: 128
  max_agents_per_world: 1
  solo_world_fraction: 1.0
  density_bins: [sparse]
  width_scales: [1.0]
  device: cuda
  static_opponents_per_world: 0

agents:
  car_length_m: 0.568
  car_width_m: 0.296
  control_hz: 20.0
  sim_dt: 0.005
  control_interval: 10
  lidar_dim: 1081
  proprio_dim: 16
  sensor_obs_dim: 1097
  action_dim: 2
  gru_hidden_dim: 512
  cnn_projection_dim: 512
  cnn_pool_bins: 64
  cnn_pool_mode: max
  actor_mlp_sizes: [1024, 1024, 1024]
  condition_dim: 10
  target_laps: 3.0
  reference_speed_mps: 1.7
  episode_seconds_min: 90.0
  episode_seconds_max: 180.0
  async_respawn: true
  physics_randomize: false

reward_conditioning:
  enabled: true
  x_drive_a: 1.25
  x_accel_a: 1.5
  enable_finish_rank: false
  enable_blocking: false
  enable_zero_sum: false

ppo:
  rollout_length: 64
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  learning_rate: 1.0e-4
  num_epochs: 2
  minibatch_size: 1024
  adaptive_filter_beta: 0.25
  adaptive_filter_eta_scale: 0.01
  adaptive_filter_enabled: true
  value_clip: false
  amp: false
  total_updates: 800
  target_kl: 0.0

evaluation:
  sync_no_respawn: true
  seeds: [0]
  suite: [solo]
  conservative_deployment_style: centered_high_collision
  soak_steps: 400
  viz_enabled: false
  incident_window_steps: 32
  device: cpu
  num_worlds: 1

ablations:
  actor_variant: gru
  frame_stack: 1
  centralized_critic: true
  adaptive_filter_enabled: true
  surprise_braking: false
  reward_randomization: false
  condition_to_actor: true

profiling:
  enabled: false
  estimate_bytes_budget: 16000000000
  report_interval_updates: 10

wandb:
  enabled: false
  mode: disabled
  entity: null
  project: f1tenth-gigaflow
  group: courtyard-multilap-ft
  name: null
  tags: []
  notes: null
  run_id: null
  resume: allow
  eval_interval_updates: 20
  log_artifacts: false
