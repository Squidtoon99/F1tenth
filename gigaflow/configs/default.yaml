config_version: 1
seed: 0

tracks:
  manifest_path: null
  num_tracks: 23
  sampling: stratified_shuffle
  include_optional_local: false

worlds:
  num_worlds: 64
  max_agents_per_world: 8
  solo_world_fraction: 0.25
  density_bins: [sparse, dense]
  width_scales: [0.8, 1.2]
  device: cuda

agents:
  car_length_m: 0.568
  car_width_m: 0.296
  control_hz: 20.0
  sim_dt: 0.005
  control_interval: 10
  lidar_dim: 1081
  proprio_dim: 16
  sensor_obs_dim: 1097
  action_dim: 2
  gru_hidden_dim: 512
  cnn_projection_dim: 512
  cnn_pool_mode: max
  cnn_pool_bins: 64
  actor_mlp_sizes: [1024, 1024, 1024]
  condition_dim: 10
  target_laps: 3.0
  reference_speed_mps: 3.5
  episode_seconds_min: 120.0
  episode_seconds_max: 360.0
  async_respawn: true
  physics_randomize: true
  mu_range: [0.55, 0.85]
  steer_gain_range: [0.84, 1.26]
  command_delay_substeps_range: [0, 4]

reward_conditioning:
  enabled: true
  x_drive_a: 1.25
  x_accel_a: 1.5
  vmax_scale_min: 0.25
  vmax_scale_max: 1.5
  enable_finish_rank: false
  enable_blocking: false
  enable_zero_sum: false

ppo:
  rollout_length: 256
  gamma: 0.999
  gae_lambda: 0.95
  caps_spatial_coef: 0.1
  caps_spatial_std: 0.05
  caps_temporal_coef: 0.02
  clip_ratio: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  learning_rate: 1.0e-4
  num_epochs: 3
  minibatch_size: 32768
  adaptive_filter_beta: 0.25
  adaptive_filter_eta_scale: 0.01
  adaptive_filter_enabled: true
  value_clip: false
  amp: true
  total_updates: 10000
  target_kl: 0.0

evaluation:
  sync_no_respawn: true
  seeds: [0, 1, 2]
  suite: [solo, head_to_head, dense]
  conservative_deployment_style: centered_high_collision
  soak_steps: 2000
  viz_enabled: true
  viz_fps: 10
  viz_max_frames: 240
  incident_window_steps: 32

ablations:
  actor_variant: gru
  frame_stack: 1
  centralized_critic: true
  adaptive_filter_enabled: true
  surprise_braking: false
  reward_randomization: true
  condition_to_actor: true

profiling:
  enabled: true
  # 64 worlds x 8 agents, MaxPool64->512-D, estimates at ~17.6 GiB allocated
  # after inplace CNN ReLU, so this template needs a 24 GiB-class card.
  estimate_bytes_budget: 24000000000
  report_interval_updates: 10

# Optional W&B (disabled by default). Never put API keys in config.
wandb:
  enabled: false
  mode: online
  entity: null
  project: f1tenth-gigaflow
  group: null
  name: null
  tags: []
  notes: null
  run_id: null
  resume: allow
  eval_interval_updates: 0
  log_artifacts: true
