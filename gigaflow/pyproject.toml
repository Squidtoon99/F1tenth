[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gigaflow-f1tenth"
version = "0.1.0"
description = "Isolated multi-track, multi-car F1TENTH self-play training stack."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "maintainers", email = "dev@example.com" }]
dependencies = [
    "imageio",
    "imageio-ffmpeg",
    "matplotlib",
    "numpy",
    "pillow",
    "pyyaml",
    "torch",
    "warp-lang>=1.15",
    "websockets",
]

[project.optional-dependencies]
dev = ["pytest", "flake8"]
cpu = ["wandb"]
gpu = ["wandb"]

[project.scripts]
gigaflow = "gigaflow_f1tenth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
