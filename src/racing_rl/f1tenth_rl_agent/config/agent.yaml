track_server:
  ros__parameters:
    # IV 2026 competition track (dfr_f1tenth_gym dev-humble). Bare filename resolves
    # from this package's bundled assets/. Use agent_oschersleben.yaml for Oschersleben.
    track_csv: "IV_2026_SIM_centerline.csv"
    frame_id: "map"
    republish_hz: 1.0

obs_debug:
  ros__parameters:
    # Read-only diagnostics: decodes /rl/observation into plottable scalars + markers.
    # pose_topic is the real-car map-frame pose (particle filter); matches vehicle_obs.
    pose_topic: "/pf/pose/odom"
    future_track_num_points: 60
    enable_markers: true
    frame_id: "map"

policy_inference:
  ros__parameters:
    # Path to the trained .pt (must include obs_norm). With require_checkpoint true
    # (default) an empty/invalid path or a checkpoint without obs_norm is a hard
    # startup error, so a mis-launched car never rolls a random-init actor. Set
    # require_checkpoint:=false only for a deliberate plumbing demo.
    checkpoint_path: ""
    require_checkpoint: true
    state_dict_key: "actor"
    device: "cpu"
    deterministic: true
    # 390-dim 1v1 layout with the opponent block zeroed for solo racing.
    enable_opponent_obs: true
    # Keep the random-init demo car moving in RViz (ignored when a checkpoint loads
    # and only reachable with require_checkpoint:=false).
    demo_throttle_floor: 0.55
    # ObsNormalizer (match config.py norm_clip / norm_eps); applied to raw obs using
    # the checkpoint's saved obs_norm stats before the actor.
    norm_clip: 10.0
    norm_eps: 1.0e-8

evaluation:
  ros__parameters:
    oob_margin_m: 0.0
    stuck_speed_mps: 0.2
    stuck_timeout_s: 3.0
    # Fixed fallback pose when random_reset is false.
    reset_x: 0.0
    reset_y: 2.0
    reset_yaw: -0.9
    auto_reset: true
    random_reset: true
    random_spawn_on_start: true
    reset_seed: -1
    # Gym-compatible free-cell spawns (AllMapResetFn dilation). Bare filename resolves
    # from this package's bundled assets/ (mirrors the gym bridge maps/).
    map_yaml: "IV_2026_SIM.yaml"
    spawn_max_dist: 1.0
    reset_grace_s: 2.0
