track_server:
  ros__parameters:
    track_csv: "/sim_ws/src/f1tenth_rl_agent/assets/IV_2026_SIM_centerline.csv"
    frame_id: "map"
    republish_hz: 1.0

policy_inference:
  ros__parameters:
    checkpoint_path: ""
    state_dict_key: "actor"
    device: "cpu"
    deterministic: true
    demo_throttle_floor: 0.55
    norm_clip: 10.0
    norm_eps: 1.0e-8
    enable_opponent_obs: true

evaluation:
  ros__parameters:
    oob_margin_m: 0.0
    stuck_speed_mps: 0.2
    stuck_timeout_s: 3.0
    reset_x: 0.0
    reset_y: 2.0
    reset_yaw: -1.465477
    auto_reset: true
    random_reset: true
    random_spawn_on_start: true
    reset_seed: -1
    map_yaml: "/sim_ws/src/f1tenth_gym_ros/maps/IV_2026_SIM.yaml"
    spawn_max_dist: 1.0
    reset_grace_s: 2.0
    enable_opponent_spawn: false
    opponent_spawn_gap_m: 7.0
    spawn_opponent_on_start: false
