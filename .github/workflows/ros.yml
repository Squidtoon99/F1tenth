name: ros

# Build + test the colcon workspace (includes ament lint via each package's tests).
# Path-filtered so it only runs when ROS code changes. CPU only — no GPU.
on:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "libs/**"
      - ".github/workflows/ros.yml"
  pull_request:
    paths:
      - "src/**"
      - "libs/**"
      - ".github/workflows/ros.yml"

jobs:
  build-test:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Install workspace dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-pip \
            python3-transforms3d \
            build-essential \
            cmake \
            ros-humble-asio-cmake-module
          rosdep update
          rosdep install --from-paths src libs --ignore-src -y -r \
            --skip-keys "ament_python python-transforms3d-pip range_libc"
          pip3 install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.4.1"

      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install

      - name: Test (build/unit tests + ament lint, vendored packages skipped)
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          ./tools/test.sh
