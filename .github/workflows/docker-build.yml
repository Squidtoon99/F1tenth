name: docker-build

# Sanity check that the base image (deps + tooling) still builds. Native arch, no
# push, no GPU. The full arm64 runtime image is built by deploy/scripts, not in CI.
on:
  push:
    branches: [develop]
    paths:
      - "deploy/docker/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "deploy/docker/**"
      - ".github/workflows/docker-build.yml"

jobs:
  base-image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build base image (sanity, native arch, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.base
          push: false
          tags: f1tenth-base:ci
