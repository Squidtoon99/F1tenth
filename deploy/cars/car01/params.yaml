# Per-car overlay: node-scoped ROS 2 parameters layered on top of the package
# launch defaults at runtime (mounted at /config/params.yaml). Passed directly to
# nodes as a parameter file -- every section must be keyed by node name with a
# `ros__parameters` block.
#
# Values below are from the on-car calibration (Jul 2026).

# --- RL drive output (f1tenth_rl_vehicle drive node) ---
drive:
  ros__parameters:
    max_steer: 0.33
    watchdog_timeout_s: 0.15
    control_dt: 0.05

# --- Current/brake VESC actuator (ADR 0006) ---
vesc_actuator:
  ros__parameters:
    i_drive_max_a: 60.0
    i_brake_max_a: 60.0
    i_brake_safe_a: 15.0
    watchdog_timeout_s: 0.15
    publish_rate_hz: 50.0
    i_slew_a_per_s: 200.0
    publish_servo: true
    steering_angle_to_servo_gain: -1.2135
    steering_angle_to_servo_offset: 0.4500

# --- RL policy inference (f1tenth_rl_agent policy_inference node) ---
policy_inference:
  ros__parameters:
    device: "cpu"

# --- RL observation builder (f1tenth_rl_vehicle vehicle_obs node) ---
vehicle_obs:
  ros__parameters:
    num_obs: 390
    enable_opponent_obs: true
    zero_opponent_obs: true
    enable_load_estimation: true
    enable_slip_estimation: true
    # Bags showed VESC /odom.twist.linear.x inverted vs commanded forward motion.
    twist_vx_sign: -1.0
    # Static IMU bias from static_imu bag (raw g units before accel scale).
    imu_ax_bias: -0.02114
    imu_ay_bias: 0.07107
    imu_accel_lp_alpha: 0.2
    # From austin_selfplay_dr_2048env_continuous policy_686080000.pt obs_norm mean[372:380]
    slip_obs_mean: [0.020809955894947052, 0.020119236782193184, 0.023194117471575737, 0.02161898836493492, -0.013843115419149399, -0.010874860920011997, -0.020557932555675507, -0.013057908043265343]
    wheel_radius_m: 0.053
    lf_m: 0.1584
    lr_m: 0.1666
    track_width_m: 0.253
    cg_height_m: 0.05
    roll_stiffness_front: 0.47

# --- VESC calibration (vendored vesc_ackermann / vesc_driver nodes) ---
/**:
  ros__parameters:
    speed_to_erpm_gain: 4300.0
    speed_to_erpm_offset: 0.0
    steering_angle_to_servo_gain: -1.2135
    steering_angle_to_servo_offset: 0.4495
    port: /dev/sensors/vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: -80000.0
    brake_max: 400000.0
    speed_min: -80000.0
    speed_max: 80000.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.05
    servo_max: 0.85

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    publish_tf: true
    use_servo_cmd_to_calc_angular_velocity: true
    wheelbase: 0.325

# --- ackermann_mux (safety topic has highest priority) ---
ackermann_mux:
  ros__parameters:
    topics:
      safety:
        topic: /brake
        timeout: 0.1
        priority: 9999
      navigation:
        topic: drive
        timeout: 0.2
        priority: 10
      joystick:
        topic: teleop
        timeout: 0.2
        priority: 100

# --- joy + joy_teleop (PS4 DualShock) ---
# Button/axis indices follow the SDL GameController mapping used by the ros-humble
# joy node: L1=9, R1=10, Cross=0, Square=2; sticks are LeftY=1, RightX=2.
joy:
  ros__parameters:
    device_id: 0
    deadzone: 0.01
    autorepeat_rate: 20.0
    coalesce_interval: 0.01

joy_teleop:
  ros__parameters:
    human_control:
      type: topic
      interface_type: ackermann_msgs/msg/AckermannDriveStamped
      topic_name: teleop
      deadman_buttons: [9]
      axis_mappings:
        # Force/current mode (ADR 0006): stick maps to normalized effort on
        # acceleration; speed stays unused (vesc_actuator ignores it).
        drive-acceleration:
          axis: 1
          scale: 1.0
          offset: 0.0
        drive-speed:
          axis: 1
          scale: 0.0
          offset: 0.0
        drive-steering_angle:
          axis: 2
          scale: 0.33
          offset: 0.0

# --- RL deadman gate (R1/L1) ---
rl_deadman_gate:
  ros__parameters:
    joy_topic: /joy
    teleop_topic: /teleop
    manual_button: 9
    autonomous_button: 10
    publish_rate_hz: 20.0

# --- PF relocalize (PS4 X / Square) ---
pf_relocalize:
  ros__parameters:
    joy_topic: /joy
    initialpose_topic: /initialpose
    track_relocalize_topic: /pf/relocalize_on_track
    localize_button: 0
    global_button: 2
    start_x: 54.177
    start_y: 12.958
    start_yaw: -0.116
    publish_repeats: 5
    publish_interval_s: 0.1
    cooldown_s: 1.0
