# Per-car overlay: node-scoped ROS 2 parameters layered on top of the package
# launch defaults at runtime (mounted at /config/params.yaml). Passed directly to
# nodes as a parameter file -- every section must be keyed by node name with a
# `ros__parameters` block.
#
# Values below are from the on-car calibration at shereef@f1tenth (Jul 2026).

# --- RL drive output (f1tenth_rl_vehicle drive node) ---
drive:
  ros__parameters:
    max_speed: 15.0
    max_steer: 0.33
    speed_limit_mps: 2.0
    # Keep speed until Part 2 force-mode validation + force-trained checkpoint.
    motor_mode: "speed"

# --- Force-mode VESC actuator (disabled until validated) ---
vesc_actuator:
  ros__parameters:
    enabled: false
    i_drive_max_a: 10.0
    i_brake_max_a: 10.0
    i_brake_safe_a: 5.0
    watchdog_timeout_s: 0.5
    publish_rate_hz: 50.0
    publish_servo: true
    zero_erpm: true
    steering_angle_to_servo_gain: -1.2135
    steering_angle_to_servo_offset: 0.4495

# --- RL policy inference (f1tenth_rl_agent policy_inference node) ---
policy_inference:
  ros__parameters:
    device: "cpu"

# --- RL observation builder (f1tenth_rl_vehicle vehicle_obs node) ---
vehicle_obs:
  ros__parameters:
    num_obs: 390
    enable_opponent_obs: true
    zero_opponent_obs: true
    enable_load_estimation: true
    enable_slip_estimation: true
    # From austin_selfplay_dr_2048env_continuous policy_686080000.pt obs_norm mean[372:380]
    slip_obs_mean: [0.020809955894947052, 0.020119236782193184, 0.023194117471575737, 0.02161898836493492, -0.013843115419149399, -0.010874860920011997, -0.020557932555675507, -0.013057908043265343]
    wheel_radius_m: 0.05
    lf_m: 0.1584
    lr_m: 0.1666
    track_width_m: 0.20
    cg_height_m: 0.05

# --- VESC calibration (vendored vesc_ackermann / vesc_driver nodes) ---
/**:
  ros__parameters:
    speed_to_erpm_gain: 4300.0
    speed_to_erpm_offset: 0.0
    steering_angle_to_servo_gain: -1.2135
    steering_angle_to_servo_offset: 0.4495
    port: /dev/sensors/vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: -80000.0
    brake_max: 400000.0
    speed_min: -80000.0
    speed_max: 80000.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.05
    servo_max: 0.85

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    publish_tf: true
    use_servo_cmd_to_calc_angular_velocity: true
    wheelbase: 0.33

throttle_interpolator:
  ros__parameters:
    rpm_input_topic: commands/motor/unsmoothed_speed
    rpm_output_topic: commands/motor/speed
    servo_input_topic: commands/servo/unsmoothed_position
    servo_output_topic: commands/servo/position
    max_acceleration: 2.5
    throttle_smoother_rate: 75.0
    max_servo_speed: 3.2
    servo_smoother_rate: 75.0

# --- ackermann_mux (safety topic has highest priority) ---
ackermann_mux:
  ros__parameters:
    topics:
      safety:
        topic: /brake
        timeout: 0.1
        priority: 9999
      navigation:
        topic: drive
        timeout: 0.2
        priority: 10
      joystick:
        topic: teleop
        timeout: 0.2
        priority: 100

# --- joy + joy_teleop (PS4 DualShock) ---
# Button/axis indices follow the SDL GameController mapping used by the ros-humble
# joy node: L1=9, R1=10, Cross=0, Square=2; sticks are LeftY=1, RightX=2.
joy:
  ros__parameters:
    device_id: 0
    deadzone: 0.01
    autorepeat_rate: 20.0
    coalesce_interval: 0.01

joy_teleop:
  ros__parameters:
    human_control:
      type: topic
      interface_type: ackermann_msgs/msg/AckermannDriveStamped
      topic_name: teleop
      deadman_buttons: [9]
      axis_mappings:
        drive-speed:
          axis: 1
          scale: 7.0
          offset: 0.0
        drive-steering_angle:
          axis: 2
          scale: 0.34
          offset: 0.0

# --- RL deadman gate (R1/L1) ---
rl_deadman_gate:
  ros__parameters:
    joy_topic: /joy
    teleop_topic: /teleop
    manual_button: 9
    autonomous_button: 10
    publish_rate_hz: 20.0

# --- PF relocalize (PS4 X / Square) ---
pf_relocalize:
  ros__parameters:
    joy_topic: /joy
    initialpose_topic: /initialpose
    track_relocalize_topic: /pf/relocalize_on_track
    localize_button: 0
    global_button: 2
    start_x: 54.177
    start_y: 12.958
    start_yaw: -0.116
    publish_repeats: 5
    publish_interval_s: 0.1
    cooldown_s: 1.0
