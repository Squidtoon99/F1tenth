# Conda environment for RL training. Defaults to the macOS (Apple Silicon) set,
# which is the local dev/test target. For the Linux/GPU box use requirements-gpu.txt
# (CUDA torch build) instead of the torch line below.
name: f1tenth-training
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # Editable shared contract: obs-space edits picked up with no rebuild.
      - -e ../libs/f1tenth_contract
      - genesis-world==0.4.3
      - torch
      - numpy
      - requests
      - tqdm
      - python-dotenv
      - rerun-sdk
      - wandb
