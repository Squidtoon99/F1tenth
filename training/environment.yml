# Optional conda env. Supported install is pip:
#   training/requirements-mac.txt  (CPU Warp tests)
#   training/requirements-gpu.txt  (CUDA)
# This file has the contract + torch but not Warp.
name: f1tenth-training
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # Editable shared contract: obs-space edits picked up with no rebuild.
      - -e ../libs/f1tenth_contract
      - torch
      - numpy
      - requests
      - tqdm
      - python-dotenv
      - rerun-sdk
      - wandb
